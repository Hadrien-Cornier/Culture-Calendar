# ---------------------------------------------------------------------------
# Classical / opera / ballet season refresh (scripts/refresh_classical_data.py)
# Maps the JSON keys in docs/classical_data.json + docs/ballet_data.json to
# the snake_case venue keys above so the Perplexity prompt builder can pull
# display_name / address. Keep keys in sync with CLASSICAL_VENUE_KEYS and
# BALLET_VENUE_KEYS in scripts/refresh_classical_data.py.
# ---------------------------------------------------------------------------
classical_refresh:
  recency_filter: month
  venues:
    austinSymphony:
      config_key: austin_symphony
      event_type: concert
      season_url: "https://my.austinsymphony.org/events"
    earlyMusicAustin:
      config_key: early_music_austin
      event_type: concert
      season_url: "https://www.early-music.org/concerts"
    laFolliaAustin:
      config_key: la_follia
      event_type: concert
      season_url: "https://lafollia.org/concerts"
    austinChamberMusic:
      config_key: austin_chamber_music
      event_type: concert
      season_url: "https://austinchambermusic.org/concerts"
    austinOpera:
      config_key: austin_opera
      event_type: opera
      season_url: "https://austinopera.org/season"
    balletAustin:
      config_key: ballet_austin
      event_type: dance
      season_url: "https://balletaustin.org/performances"

# ---------------------------------------------------------------------------
# Static-JSON scraper registry (consumed by src/scraper.py).
# Each entry fully specifies a StaticJsonScraper instance; MultiVenueScraper
# builds one per entry instead of a per-venue wrapper class (the six near-
# identical wrappers were collapsed into this config). data_file is repo-
# relative and resolved at runtime via BaseScraper.get_project_path. venue_key
# must match a key under `venues:` so event-type resolution stays config-driven
# (get_assumed_event_category). venue_name doubles as the venue_code emitted by
# scrape_all_venues. Irregularities preserved from the old wrappers: Symphony
# alone uses expand_dates: false; Ballet alone reads ballet_data.json and is
# typed dance; Opera is typed opera.
# ---------------------------------------------------------------------------
static_json_scrapers:
  austin_symphony:
    base_url: "https://austinsymphony.org"
    venue_name: "Symphony"
    top_level_key: austinSymphony
    default_event_type: concert
    default_time: "8:00 PM"
    default_location: "Dell Hall at Long Center"
    expand_dates: false
    data_file: "docs/classical_data.json"
  early_music_austin:
    base_url: "https://www.early-music.org"
    venue_name: "EarlyMusic"
    top_level_key: earlyMusicAustin
    default_event_type: concert
    default_time: "7:30 PM"
    default_location: "Various Austin Venues"
    expand_dates: true
    data_file: "docs/classical_data.json"
  la_follia:
    # Domain moved in 2026; lafolliaaustin.org no longer resolves.
    base_url: "https://www.lafollia.org"
    venue_name: "LaFollia"
    top_level_key: laFolliaAustin
    default_event_type: concert
    default_time: "7:30 PM"
    default_location: "Various Austin Venues"
    expand_dates: true
    data_file: "docs/classical_data.json"
  austin_chamber_music:
    base_url: "https://austinchambermusic.org"
    venue_name: "Chamber Music"
    top_level_key: austinChamberMusic
    default_event_type: concert
    default_time: "7:30 PM"
    default_location: "Austin Chamber Music Center"
    expand_dates: true
    data_file: "docs/classical_data.json"
  austin_opera:
    base_url: "https://austinopera.org"
    venue_name: "Opera"
    top_level_key: austinOpera
    default_event_type: opera
    default_time: "8:00 PM"
    default_location: "Long Center for the Performing Arts"
    expand_dates: true
    data_file: "docs/classical_data.json"
  ballet_austin:
    base_url: "https://balletaustin.org"
    venue_name: "BalletAustin"
    top_level_key: balletAustin
    default_event_type: dance
    default_time: "7:30 PM"
    default_location: "The Long Center"
    expand_dates: true
    data_file: "docs/ballet_data.json"

# ---------------------------------------------------------------------------
# Venue codes that are NOT derivable from a scraper registry.
#
# MultiVenueScraper stamps each event with a short venue code; downstream
# builders resolve it back to a `venues:` key to look up display_name and
# address. Registry-backed venues derive this from their `venue_name`, but the
# hand-written scrapers below use codes that differ arbitrarily from their
# config key ("Chamber Music" -> austin_chamber_music, "LivraBooks" ->
# libra_books), so they are listed explicitly.
#
# This replaces a hardcoded dict that was duplicated in
# update_website_data.py and scripts/build_event_shells.py. The two copies had
# already drifted out of sync - both were missing ArtAustin and IshidaDance,
# which is why those venues shipped with an empty venue_address.
# Read via ConfigLoader.get_venue_code_map().
# ---------------------------------------------------------------------------
venue_code_aliases:
  AFS: afs
  Hyperreal: hyperreal
  Paramount: paramount
  AlienatedMajesty: alienated_majesty
  FirstLight: first_light
  ArtsOnAlexander: arts_on_alexander
  NowPlayingAustinVisualArts: now_playing_austin_visual_arts
  LivraBooks: libra_books
  ArtAustin: artaustin
  IshidaDance: ishida_dance

# ---------------------------------------------------------------------------
# Live-site LLM scraper registry (consumed by src/scraper.py).
#
# Each entry fully specifies a WebLlmScraper instance; MultiVenueScraper builds
# one per entry and registers it for scraping automatically, so a new venue is
# a config edit with no Python. Contrast static_json_scrapers above, which
# reads curated local JSON - these fetch the venue's live site and extract
# events with an LLM using the schema from ConfigLoader.get_extraction_schema.
#
# venue_key must match a key under `venues:` so classification, address, and
# extraction guidance stay config-driven. venue_name doubles as the venue_code
# stamped onto events by scrape_all_venues.
#
# fetch:
#   http        plain requests through the shared session. Default; use it
#               unless the site proves it needs otherwise.
#   playwright  headless Chromium render, for listings built client-side.
#   perplexity  never fetches the page; asks Perplexity to read the domain.
#               The escape hatch for sites that 403 scrapers.
#
# preserve_venue_name: true keeps the per-event venue the extractor found
# instead of stamping the venue_code - for aggregators and artist pages, where
# one feed covers many host venues.
# ---------------------------------------------------------------------------
web_llm_scrapers:
  icosa:
    base_url: "https://icosacollective.com"
    venue_name: "ICOSA"
    urls: ["/exhibitions/"]
    fetch: http
    default_event_type: visual_arts
    default_time: "12:00"

  marthas_contemporary:
    # Domain moved: marthascontemporary.com 301s to marthas.gallery.
    base_url: "https://marthas.gallery"
    venue_name: "MarthasContemporary"
    urls: ["/exhibitions"]
    fetch: http
    default_event_type: visual_arts
    default_time: "12:00"

  ivester_contemporary:
    # ArtCloud-hosted: the listing renders client-side, so a plain fetch only
    # ever sees "Loading...". Verified: Playwright yields the full exhibition
    # list with run dates.
    base_url: "https://ivestercontemporary.com"
    venue_name: "IvesterContemporary"
    urls: ["/exhibitions/", "/events/"]
    fetch: playwright
    default_event_type: visual_arts
    default_time: "12:00"

  mclennon_pen:
    base_url: "https://mclennonpenco.com"
    venue_name: "McLennonPen"
    urls: ["/exhibitions"]
    fetch: http
    default_event_type: visual_arts
    default_time: "12:00"

  women_and_their_work:
    base_url: "https://womenandtheirwork.org"
    venue_name: "WomenAndTheirWork"
    urls: ["/exhibitions/", "/events/"]
    fetch: http
    default_event_type: visual_arts
    default_time: "12:00"

  mass_gallery:
    # /exhibitions is a title-only archive index with no dates on it; the
    # homepage is where the current show and its run dates actually live.
    base_url: "https://massgallery.org"
    venue_name: "MassGallery"
    urls: ["/"]
    fetch: http
    default_event_type: visual_arts
    default_time: "12:00"

  flatbed_press:
    base_url: "https://flatbedpress.com"
    venue_name: "FlatbedPress"
    urls: ["/exhibitions/"]
    fetch: http
    default_event_type: visual_arts
    default_time: "12:00"

  blanton:
    base_url: "https://blantonmuseum.org"
    venue_name: "Blanton"
    urls: ["/exhibitions/"]
    fetch: http
    default_event_type: visual_arts
    default_time: "10:00"

  contemporary_austin:
    # thecontemporaryaustin.org returns 403 to direct fetches, so this venue
    # reads through Perplexity's domain-restricted search instead.
    base_url: "https://thecontemporaryaustin.org"
    venue_name: "ContemporaryAustin"
    urls: ["/exhibitions/"]
    fetch: perplexity
    default_event_type: visual_arts
    default_time: "11:00"
    preserve_venue_name: true  # splits across Jones Center and Laguna Gloria

  mexic_arte:
    base_url: "https://mexic-artemuseum.org"
    venue_name: "MexicArte"
    urls: ["/exhibitions/"]
    fetch: http
    default_event_type: visual_arts
    default_time: "10:00"

  umlauf:
    # /exhibitions is a nav hub with no listings on it even after a JS render;
    # the homepage carries the dated event/exhibition feed.
    base_url: "https://www.umlaufsculpture.org"
    venue_name: "Umlauf"
    urls: ["/"]
    fetch: http
    default_event_type: visual_arts
    default_time: "10:00"

  bullock:
    base_url: "https://www.thestoryoftexas.com"
    venue_name: "Bullock"
    urls: ["/visit/exhibits"]
    fetch: http
    default_event_type: visual_arts
    default_time: "10:00"

  ariel_wood:
    base_url: "http://www.ariel-wood-art.com"
    venue_name: "ArielWood"
    urls: ["/info"]
    fetch: http
    default_event_type: visual_arts
    default_time: "12:00"
    preserve_venue_name: true  # shows are hosted by other galleries

  ishida_dance:
    # Migrated off a bespoke scraper. That scraper read schema.org Event blocks
    # from the page's JSON-LD; the site now emits only a WebSite block, so it
    # had been silently returning 0 events for weeks (issue #45) while the
    # performance dates sat in the page as plain prose ("June 18-20, 2026
    # AUSTIN / Dell Fine Arts Center"). LLM extraction reads that fine and does
    # not break the next time the markup is rebuilt.
    base_url: "https://www.ishidadance.org"
    venue_name: "IshidaDance"
    urls: ["/"]
    fetch: http
    default_event_type: dance
    default_time: "19:30"

  now_playing_austin_visual_arts:
    # Migrated off a bespoke HTML scraper: nowplayingaustin.com now returns 403
    # to any direct fetch (verified on both the listing and the site root), so
    # the CSS-selector parser had no input and reported 0 events behind a green
    # check. Perplexity's domain-restricted search is the same escape hatch
    # artaustin already uses for a 403 site.
    base_url: "https://nowplayingaustin.com"
    venue_name: "NowPlayingAustinVisualArts"
    urls: ["/categories/visual-art/"]
    fetch: perplexity
    default_event_type: visual_arts
    default_time: "12:00"
    preserve_venue_name: true  # citywide aggregator: keep the host gallery


