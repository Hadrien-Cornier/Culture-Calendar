version: 1

style:
  field_naming: snake_case

date_time_spec:
  date_field: dates
  time_field: times
  date_format: "YYYY-MM-DD"
  time_format: "HH:mm"
  zip_rule: pairwise_equal_length
  timezone: local

validation:
  fail_fast: true
  error_on_missing_required_on_publish: true
  error_on_mismatched_dates_times_length: true

# LLM provider/model selection. OpenRouter is preferred (cheaper) when
# OPENROUTER_API_KEY is set; Anthropic Claude is the automatic fallback.
# Override the model per-run with env OPENROUTER_MODEL / ANTHROPIC_MODEL.
llm:
  openrouter_model: deepseek/deepseek-v4-flash
  anthropic_model: claude-haiku-4-5-20251001

ontology:
  labels:
    - movie
    - book_club
    - concert
    - opera
    - dance
    - visual_arts
    - other

templates:
  movie:
    grouping: by_title
    fields:
      - title
      - dates
      - times
      - director
      - runtime_minutes
      - release_year
      - country
      - language
      - rating
      - one_liner_summary
      - description
      - url
      - venue
      - screenings
      - review_confidence
    required_on_publish:
      - title
      - dates
      - times
      - rating
      - one_liner_summary
      - description
      - director
      - runtime_minutes
      - release_year
      - country
      - screenings
    field_definitions:
      review_confidence:
        type: string
        default: "unknown"
        required: false
        description: "Confidence of the AI-generated review: low | medium | high | unknown."
      screenings:
        type: array
        description: "Array of specific event screenings. Generated from dates/times arrays."
        item_schema:
          type: object
          properties:
            date:
              type: string
              description: "Event date in YYYY-MM-DD format"
            time:
              type: string  
              description: "Event time (e.g., '11:00', '7:00 PM', 'TBD')"
            url:
              type: string
              description: "Source URL for this occurrence"
            venue:
              type: string
              description: "Venue name for this occurrence"
          required:
            - date
            - time
            - url
            - venue

  book_club:
    grouping: unique
    fields:
      - title
      - dates
      - times
      - book
      - author
      - publication_year
      - series
      - host
      - rating
      - one_liner_summary
      - description
      - url
      - venue
      - screenings
      - review_confidence
    required_on_publish:
      - title
      - dates
      - times
      - rating
      - one_liner_summary
      - description
      - book
      - author
      - screenings
    field_definitions:
      review_confidence:
        type: string
        default: "unknown"
        required: false
        description: "Confidence of the AI-generated review: low | medium | high | unknown."
      title:
        type: string
        description: "Format as '[Series Name] - [Book Title]' (e.g., 'NYRB Book Club - Nightmare Alley'). Extract the series name from headers and combine with the book title."
      book:
        type: string
        description: "ONLY the book title being discussed (e.g., 'Nightmare Alley'). Extract from patterns like 'Nightmare Alley by William Lindsey Gresham' - keep only the title part before 'by'."
      author:
        type: string
        description: "ONLY the author's name (e.g., 'William Lindsey Gresham'). Extract from patterns like 'Nightmare Alley by William Lindsey Gresham' - keep only the name part after 'by'."
      dates:
        type: array
        description: "Event dates in YYYY-MM-DD format. For dates without years: use current year for current month-December, use next year for January-current month."
      times:
        type: array
        description: "Meeting times in 24-hour format like '11:00' or '15:00'. Look for text like 'Meets the 1st Saturday of every month at 11am' in each book club section description."
      venue:
        type: string
        description: "The location where the book club meets (e.g., 'Alienated Majesty Books', 'First Light Books')."
      host:
        type: string
        description: "Organization running the book club (e.g., 'Austin NYRB Book Club', 'East Austin Writing Project'). Look for text like 'Run by [Organization Name]' in descriptions."
      description:
        type: string
        description: "Full description of the book club series. Include the tagline, meeting schedule, and organizer information."
      series:
        type: string
        description: "Book club series name exactly as shown in section headers (e.g., 'NYRB Book Club', 'Subculture Lit', 'A Season Of', 'Voyage Out', 'Apricot Trees Exist')."
      url:
        type: string
        description: "The source URL of the webpage where the event was found."
      publication_year:
        type: integer
        description: "The year the book was published."
      rating:
        type: float
        description: "Rating score for the event (1.0-5.0)."
      one_liner_summary:
        type: string
        description: "A brief, compelling summary of the book club event."
      screenings:
        type: array
        description: "Array of specific event screenings. Generated from dates/times arrays."
        item_schema:
          type: object
          properties:
            date:
              type: string
              description: "Event date in YYYY-MM-DD format"
            time:
              type: string  
              description: "Event time (e.g., '11:00', '7:00 PM', 'TBD')"
            url:
              type: string
              description: "Source URL for this occurrence"
            venue:
              type: string
              description: "Venue name for this occurrence"
          required:
            - date
            - time
            - url
            - venue

  concert:
    grouping: unique
    fields:
      - title
      - dates
      - times
      - program
      - series
      - featured_artist
      - composers
      - works
      - venue
      - rating
      - one_liner_summary
      - description
      - url
      - screenings
      - review_confidence
    required_on_publish:
      - title
      - dates
      - times
      - rating
      - one_liner_summary
      - description
      - program
      - screenings
    field_definitions:
      review_confidence:
        type: string
        default: "unknown"
        required: false
        description: "Confidence of the AI-generated review: low | medium | high | unknown."
      screenings:
        type: array
        description: "Array of specific event screenings. Generated from dates/times arrays."
        item_schema:
          type: object
          properties:
            date:
              type: string
              description: "Event date in YYYY-MM-DD format"
            time:
              type: string  
              description: "Event time (e.g., '11:00', '7:00 PM', 'TBD')"
            url:
              type: string
              description: "Source URL for this occurrence"
            venue:
              type: string
              description: "Venue name for this occurrence"
          required:
            - date
            - time
            - url
            - venue

  opera:
    grouping: unique
    fields:
      - title
      - dates
      - times
      - program
      - series
      - featured_artist
      - composers
      - works
      - venue
      - rating
      - one_liner_summary
      - description
      - url
      - screenings
      - review_confidence
    required_on_publish:
      - title
      - dates
      - times
      - rating
      - one_liner_summary
      - description
      - program
      - screenings
    field_definitions:
      review_confidence:
        type: string
        default: "unknown"
        required: false
        description: "Confidence of the AI-generated review: low | medium | high | unknown."
      screenings:
        type: array
        description: "Array of specific event screenings. Generated from dates/times arrays."
        item_schema:
          type: object
          properties:
            date:
              type: string
              description: "Event date in YYYY-MM-DD format"
            time:
              type: string  
              description: "Event time (e.g., '11:00', '7:00 PM', 'TBD')"
            url:
              type: string
              description: "Source URL for this occurrence"
            venue:
              type: string
              description: "Venue name for this occurrence"
          required:
            - date
            - time
            - url
            - venue

  dance:
    grouping: unique
    fields:
      - title
      - dates
      - times
      - program
      - series
      - venue
      - rating
      - one_liner_summary
      - description
      - url
      - screenings
      - review_confidence
    required_on_publish:
      - title
      - dates
      - times
      - rating
      - one_liner_summary
      - description
      - program
      - screenings
    field_definitions:
      review_confidence:
        type: string
        default: "unknown"
        required: false
        description: "Confidence of the AI-generated review: low | medium | high | unknown."
      # This template listed eleven fields but defined only two, so
      # get_extraction_schema produced an almost-empty schema and LLM
      # extraction could not work for a dance venue at all. Same defect the
      # visual_arts template had for dates/times.
      title:
        type: string
        description: "Title of the dance production or performance."
      dates:
        type: array
        description: "Performance dates in YYYY-MM-DD format, one entry per performance. A run like 'June 18-20, 2026' is three dates. For dates without a year: use the current year for the current month through December, and next year for January through the current month."
      times:
        type: array
        description: "Curtain times in 24-hour format like '19:30', one per date and in the same order as `dates`. Omit rather than guessing when no time is published."
      program:
        type: string
        description: "Description of the program: the works performed, the choreography, and what the evening consists of."
      series:
        type: string
        description: "Season or series the production belongs to (e.g. 'Ballet Austin 2026/27 Season')."
      venue:
        type: string
        description: "Theater or space hosting the performance (e.g. 'The Long Center', 'Dell Fine Arts Center')."
      url:
        type: string
        description: "Source URL for the performance listing."
      screenings:
        type: array
        description: "Array of specific event screenings. Generated from dates/times arrays."
        item_schema:
          type: object
          properties:
            date:
              type: string
              description: "Event date in YYYY-MM-DD format"
            time:
              type: string
              description: "Event time (e.g., '11:00', '7:00 PM', 'TBD')"
            url:
              type: string
              description: "Source URL for this occurrence"
            venue:
              type: string
              description: "Venue name for this occurrence"
          required:
            - date
            - time
            - url
            - venue

  visual_arts:
    grouping: unique
    fields:
      - title
      - dates
      - times
      - end_date
      - artist
      - artists
      - medium
      - series
      - venue
      - rating
      - one_liner_summary
      - description
      - url
      - screenings
      - review_confidence
    required_on_publish:
      - title
      - dates
      - times
      - venue
      - url
      - rating
      - one_liner_summary
      - description
      - screenings
    field_definitions:
      review_confidence:
        type: string
        default: "unknown"
        required: false
        description: "Confidence of the AI-generated review: low | medium | high | unknown."
      title:
        type: string
        description: "Title of the exhibition, installation, or visual arts event."
      # dates/times were listed under `fields:` but had no field_definitions
      # entry, so get_extraction_schema never asked the LLM for them and every
      # extracted exhibition arrived undated. Exhibitions run over a range, so
      # the guidance below is deliberately different from a single-showtime
      # venue: emit the opening date plus any dated one-off happenings.
      dates:
        type: array
        description: "Event dates in YYYY-MM-DD format. For an exhibition that runs over a range, use the opening/start date. Add a separate entry for each dated happening (opening reception, artist talk, closing reception). For dates without a year: use the current year for the current month through December, and next year for January through the current month."
      times:
        type: array
        description: "Start times in 24-hour format like '18:00' or '10:00', one per date and in the same order as `dates`. Use the reception start time for receptions and the gallery's opening hour for an exhibition run. If no time is given, omit the entry rather than guessing."
      # Exhibitions are the one category that runs for weeks rather than
      # happening at an instant, so a start date alone cannot tell us whether a
      # show is still up. Without this, everything currently on view looks
      # expired the day after it opens.
      end_date:
        type: string
        required: false
        description: "Closing date in YYYY-MM-DD format for an exhibition that runs over a range (e.g. 'August 14 - September 12, 2026' has end_date 2026-09-12). Omit for one-off events like a reception or artist talk."
      artist:
        type: string
        description: "Primary artist name when a single artist is featured. Optional — omit for group shows."
      artists:
        type: array
        description: "List of artist names for group exhibitions. Optional — omit for solo shows."
      medium:
        type: string
        description: "Artistic medium or form (e.g., 'painting', 'sculpture', 'mixed media', 'photography', 'installation')."
      series:
        type: string
        description: "Exhibition series or program name if the event belongs to a recurring curatorial series."
      venue:
        type: string
        description: "Gallery, museum, or space hosting the exhibition."
      url:
        type: string
        description: "Source URL for the exhibition listing."
      rating:
        type: float
        description: "AI-generated artistic-merit rating for the exhibition."
      one_liner_summary:
        type: string
        description: "Concise one-line hook summarizing the exhibition."
      description:
        type: string
        description: "Art-critic-style analysis of the exhibition and its significance."
      screenings:
        type: array
        description: "Array of specific event occurrences. Generated from dates/times arrays."
        item_schema:
          type: object
          properties:
            date:
              type: string
              description: "Event date in YYYY-MM-DD format"
            time:
              type: string
              description: "Event time (e.g., '11:00', '7:00 PM', 'TBD')"
            url:
              type: string
              description: "Source URL for this occurrence"
            venue:
              type: string
              description: "Venue name for this occurrence"
          required:
            - date
            - time
            - url
            - venue

  other:
    grouping: unique
    fields:
      - title
      - dates
      - times
      - venue
      - rating
      - one_liner_summary
      - description
      - url
      - screenings
      - review_confidence
    required_on_publish:
      - title
      - dates
      - times
      - rating
      - one_liner_summary
      - description
      - venue
      - screenings
    field_definitions:
      review_confidence:
        type: string
        default: "unknown"
        required: false
        description: "Confidence of the AI-generated review: low | medium | high | unknown."
      screenings:
        type: array
        description: "Array of specific event screenings. Generated from dates/times arrays."
        item_schema:
          type: object
          properties:
            date:
              type: string
              description: "Event date in YYYY-MM-DD format"
            time:
              type: string  
              description: "Event time (e.g., '11:00', '7:00 PM', 'TBD')"
            url:
              type: string
              description: "Source URL for this occurrence"
            venue:
              type: string
              description: "Venue name for this occurrence"
          required:
            - date
            - time
            - url
            - venue

pipeline_defaults:
  classification:
    enabled: true
  enrichment:
    enabled: true
  scrape:
    frequency: daily   # daily | weekly | monthly | manual

field_defaults:
  rating: -1  # Unrated
  description: "No description available"
  country: "USA"
  language: "English"
  url: ""
  venue: ""
  review_confidence: "unknown"

distribution:
  # Buttondown mailing-list endpoint (free tier, user-provided).
  # Empty string = feature disabled; UI renders a "Coming soon" stub
  # and no POST is attempted. See CLAUDE.md long-run 20260421-225013.
  # Buttondown embed-subscribe form URL the masthead signup form POSTs to
  # (docs/script.js initSignupForm). Format is fixed by Buttondown; the
  # trailing slug is the Buttondown account username. If you register a
  # different username, change it here — docs/config.json is rebuilt on deploy.
  buttondown_endpoint: "https://buttondown.email/api/emails/embed-subscribe/culture-calendar"

